<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Crafted by Immortal">
  <defs>
    <linearGradient id="fText" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0; 260 0; -260 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="fShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="fClip"><rect x="14" y="18" width="692" height="114" rx="57"/></clipPath>
  </defs>

  <!-- Pill body -->
  <rect x="14" y="18" width="692" height="114" rx="57" fill="#0b1226"/>
  <!-- Double animated gradient ring -->
  <rect x="14" y="18" width="692" height="114" rx="57" fill="none" stroke="url(#fStroke)" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="26" width="676" height="98" rx="49" fill="none" stroke="#31406f" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.9;0.3;0.9" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Shine sweep across the pill -->
  <g clip-path="url(#fClip)">
    <rect x="60" y="10" width="170" height="130" fill="url(#fShine)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="-140 0; 700 0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Orbiting diamond emblem -->
  <g transform="translate(96 75)">
    <circle r="40" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="4 7" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect x="-12" y="-12" width="24" height="24" rx="5" fill="none" stroke="#22d3ee" stroke-width="2.6" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle r="4" fill="#22d3ee">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Small orbiting satellite dot -->
    <circle r="3.2" fill="#818cf8">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 40 0 A 40 40 0 1 1 -40 0 A 40 40 0 1 1 40 0"/>
    </circle>
  </g>

  <!-- Text with glow underlay -->
  <text x="168" y="68" font-size="15" letter-spacing="6" font-weight="600" fill="#8fa3c8">CRAFTED WITH</text>
  <text x="168" y="110" font-size="46" font-weight="800" letter-spacing="7" fill="#818cf8" filter="url(#fGlow)" opacity="0.5">IMMORTAL
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="168" y="110" font-size="46" font-weight="800" letter-spacing="7" fill="url(#fText)">IMMORTAL</text>

  <!-- Heartbeat dot -->
  <circle cx="660" cy="75" r="6" fill="#f472b6">
    <animate attributeName="r" values="4.5;7;4.5" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
